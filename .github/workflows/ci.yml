name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # S5.0 (#28): real services for the Phase B integration tests — the Celery media-queue
    # round-trip needs a Redis broker, and the SQLite→Postgres migration path is exercised
    # on every push (repo policy: no mocking of infrastructure).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sme
          POSTGRES_PASSWORD: sme
          POSTGRES_DB: sme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sme"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SME_TEST_POSTGRES_URL: postgresql+psycopg://sme:sme@localhost:5432/sme_test
      SME_CELERY_BROKER_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (black)
        run: uv run black --check .
      # NFR-7 (S0.6, #81). `-rs` puts the skip list on the record: CI and a dev box skip
      # different suites, which is why their coverage totals differ.
      - name: Tests (pytest, with coverage data)
        run: uv run pytest -rs --cov=app --cov-report=
      # The gate is a separate step on purpose. pytest-cov does NOT reliably fail the run on a
      # config-only `fail_under` — it printed "FAIL Required test coverage of 90.0% not reached"
      # and still exited 0 here. coverage.py's own CLI exits 2, and reads the same
      # `[tool.coverage.report]` block, so `uv run coverage report` gates identically locally.
      - name: Coverage report + NFR-7 gate
        run: uv run coverage report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      # S0.6 (#81): reported, not gated — the dashboard's tested surface is `lib/` and the
      # number is here to be watched, not to block a PR. See dashboard/vitest.config.ts.
      - name: Tests + coverage (vitest)
        run: npm run test:coverage
