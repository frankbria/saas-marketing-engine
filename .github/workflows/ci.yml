name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # S5.0 (#28): real services for the Phase B integration tests — the Celery media-queue
    # round-trip needs a Redis broker, and the SQLite→Postgres migration path is exercised
    # on every push (repo policy: no mocking of infrastructure).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sme
          POSTGRES_PASSWORD: sme
          POSTGRES_DB: sme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sme"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SME_TEST_POSTGRES_URL: postgresql+psycopg://sme:sme@localhost:5432/sme_test
      SME_CELERY_BROKER_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # The media suites (video/podcast render, media queue round-trips) self-skip without
      # ffmpeg and a DejaVu font, which a GitHub runner does not ship. Skipping them here left
      # 13 tests unrun and the render paths uncovered — found via `-rs` while wiring up S0.6.
      - name: Media toolchain (ffmpeg + DejaVu)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (black)
        run: uv run black --check .
      # NFR-7 (S0.6, #81). Two steps, one job each:
      #   pytest  -> fails on test failures.   `--cov-fail-under=0` disables pytest-cov's own
      #              threshold so a coverage regression cannot surface as a confusing test-step
      #              failure. It only collects the data.
      #   coverage -> fails on coverage.       This is the gate.
      # pytest-cov's config-only `fail_under` enforcement is not dependable: it printed
      # "FAIL Required test coverage of 90.0% not reached" against 89.95% and still exited 0 in
      # this workflow. coverage.py's CLI exits 2 and reads the same `[tool.coverage.report]`
      # block, so `uv run coverage report` gates identically on a dev box.
      # `-rs` keeps the skip list on the record — it is what exposed the missing ffmpeg.
      - name: Tests (pytest, with coverage data)
        run: uv run pytest -rs --cov=app --cov-report= --cov-fail-under=0
      - name: Coverage report + NFR-7 gate
        run: uv run coverage report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      # S0.6 (#81): reported, not gated — the dashboard's tested surface is `lib/` and the
      # number is here to be watched, not to block a PR. See dashboard/vitest.config.ts.
      - name: Tests + coverage (vitest)
        run: npm run test:coverage
