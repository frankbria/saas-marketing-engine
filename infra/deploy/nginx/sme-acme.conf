# ACME HTTP-01 challenge path — included by every vhost `deploy_site` generates (S0.5, #80).
#
# This exists because of a trap #78 set and the #80 issue comment predicted:
#
#   #78 added `location ~ /\. { deny all; }` to every generated vhost, to hide the atomic-write
#   sidecars the crank leaves in the served tree. That regex matches ANY path containing "/." —
#   including `/.well-known/acme-challenge/`. certbot writes its challenge there, nginx denies it,
#   validation times out, and the site silently stays HTTP-only with nothing in the app logs.
#
# `^~` makes this a PREFIX match, and nginx resolves a matching `^~` prefix location BEFORE it
# considers any regex location. That ordering — not the position of this include in the file — is
# what beats the dotfile deny. Do not "simplify" this to a plain `location /.well-known/...`:
# a plain prefix match loses to a matching regex, and the deny would win again.
#
# The webroot is shared and outside every product's workspace on purpose: certbot needs to write
# it, the engine must never serve it as content, and one directory keeps renewals uniform across
# every domain the engine hosts.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type "text/plain";
    # No `try_files` fallback: a missing challenge must 404 so certbot fails loudly and fast,
    # rather than being handed the landing page with a 200 and reporting an opaque mismatch.
}
