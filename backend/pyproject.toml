[project]
name = "saas-marketing-engine-backend"
version = "0.1.0"
description = "SaaS Marketing Engine — FastAPI backend (private dashboard API + public funnel API)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-dotenv==1.1.1",
    "sqlmodel==0.0.24",
    "apscheduler==3.11.0",
    "cryptography==45.0.5",
    "anthropic>=0.112.0",
    "jinja2==3.1.4",
    "praw==7.8.1",
    "celery[redis]==5.6.3",
    "psycopg[binary]==3.3.4",
    # S5.0.1 (#84): imported at module scope by the RunPod provisioner, the YouTube uploader and
    # both ElevenLabs TTS paths. It used to resolve only because `anthropic` pulled it in
    # transitively — an anthropic release that swapped its HTTP client would have broken GPU
    # provisioning and publishing at import time, in production, blamed on an unrelated bump.
    # The GPU worker image installs `--no-dev` from the lockfile, so the split is load-bearing.
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-cov==7.0.0",
    "ruff==0.12.5",
    "black==25.1.0",
]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# NFR-7 (S0.6, #81): coverage is measured over the engine logic in `app/` and gated in CI.
# Coverage flags are NOT in `addopts` on purpose — local runs are targeted (see backend/README.md)
# and would trip `fail_under` on a single-file run. CI passes `--cov` explicitly.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
# The table lists only files with gaps; 100%-covered files are summarised as a count.
skip_covered = true
# Two decimals: the gate is compared against the exact total, so the exact total is what the
# report should print. A bare "92%" hides whether the next commit has 0.4 points of room.
precision = 2
# Ratchet, not an aspiration. NFR-7 asks for >85%.
#
# The gate tracks the CI number — CI is the authoritative environment, and the only one that
# runs everything short of the paid-API tests (661 passed / 11 skipped on 2026-08-10, all 11
# gated on SME_ANTHROPIC_API_KEY or SME_STRIPE_API_KEY). A dev box without Redis, Postgres
# and those env vars reads *lower*; do not retune this to a local number.
#
# Measured 2026-08-10 in CI: 92.13%. Gate at 92.
#
# Raise this when coverage rises; never lower it to make a red build green — add the tests.
# `uv run coverage report` is what enforces it (see .github/workflows/ci.yml): pytest-cov does
# NOT reliably fail the run on a config-only `fail_under` — it printed FAIL and still exited 0
# in CI. coverage.py's own CLI exits 2. Do not "simplify" the gate back into the pytest step.
fail_under = 92
exclude_also = [
    # Typing-only branches never execute at runtime.
    "if TYPE_CHECKING:",
    # Abstract/unimplemented seams are contracts, not behaviour.
    "raise NotImplementedError",
    # Script entrypoints are exercised by running the process, not by pytest.
    'if __name__ == "__main__":',
]
